# 로컬 개발(CPU, 가짜 모델).   docker compose up --build
#   확인: curl -H "Authorization: Bearer dev-key" http://localhost:8000/readyz
# 데모(콜백 수신기 + 재생기):  docker compose --profile demo up --build
# 아래 키·비밀은 로컬 개발용 값이다. 운영 값은 환경 변수/RunPod 시크릿으로만 넣는다.
services:
  vision:
    build: .
    ports:
      - "8000:8000"
    environment:
      VISION_API_KEY: dev-key
      VISION_API_KEY_NEXT: ""
      VISION_DETECTOR: fake
      VISION_FAKE_SCENARIO: normal
      VISION_MAX_SESSIONS: "40"
      VISION_CALLBACK_URL: ${VISION_CALLBACK_URL:-http://sink:9000/internal/vision/events}
      VISION_CALLBACK_KEY_ID: k1
      VISION_CALLBACK_SECRET: dev-callback-secret
    ulimits:
      core: 0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 실제 모델(CPU 로 로컬 확인용): docker compose --profile real up --build vision-real
  #   models/ 폴더(git 제외)를 /models 로 읽기 전용 마운트한다. GPU 는 호스트에 NVIDIA 런타임이 있을 때 deploy 항목의 주석을 푼다.
  vision-real:
    profiles: [real]
    build:
      context: .
      args:
        UV_EXTRAS: "--extra real"
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    environment:
      VISION_API_KEY: dev-key
      VISION_DETECTOR: real
      VISION_MODELS_DIR: /models
      VISION_RULES_PATH: ${VISION_RULES_PATH:-configs/rules.default.yaml}
      VISION_CALLBACK_URL: ${VISION_CALLBACK_URL:-http://sink:9000/internal/vision/events}
      VISION_CALLBACK_SECRET: dev-callback-secret
    ulimits:
      core: 0
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  sink:
    profiles: [demo]
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app:ro
    environment:
      VISION_CALLBACK_SECRET: dev-callback-secret
      PYTHONPATH: /app/src
    command: sh -c "pip install -q fastapi 'uvicorn[standard]' && python tools/replay/sink.py --port 9000"
    ports:
      - "9000:9000"
