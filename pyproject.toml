[project]
name = "pair-vision"
version = "0.1.0"
description = "pAIr 서버 추론 감독용 추론 서버 (계약 뼈대 + 가짜 모델)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "pyyaml>=6",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# 실제 모델(VISION_DETECTOR=real). 가짜 모델·CPU 도커 이미지에는 필요 없다. GPU 이미지는 CUDA 용 torch 를 따로 정한다(이번 범위 밖).
real = [
    "torch>=2.4",
    "transformers>=5.0",
    "mediapipe>=0.10",
    "pillow>=10",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pair_vision"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
